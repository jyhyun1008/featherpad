<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FeatherPad</title>
<!-- PWA: 홈 화면 추가 시 브라우저 UI 숨김 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="FeatherPad">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png?v=2">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;500;700&display=swap');

  :root {
    --accent: #3b82f6;
    --accent2: #0ea5e9;
    --text: rgba(255,255,255,0.95);
    --text-dim: rgba(255,255,255,0.55);
    --bg-image: none; /* buttons.js CONFIG.bgImage 에서 동적으로 주입 */
    --glass: rgba(180,210,255,0.09);
    --glass-border: rgba(180,210,255,0.2);
    --glass-hover: rgba(180,210,255,0.16);
    --radius: 20px;
    --success: #10b981;
    --header-h: 52px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    touch-action: manipulation; /* 더블탭 줌 차단 */
  }

  body {
    font-family: 'DM Sans', sans-serif;
    display: flex;
    flex-direction: column;
    background: #0d0d0d;
  }

  /* ── Header ── */
  header {
    z-index: 10;
    height: var(--header-h);
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0d0d0d;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: white;
  }

  .header-right { display: flex; align-items: center; gap: 12px; }

  .edit-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    padding: 4px 12px;
    color: rgba(255,255,255,0.8);
    font-size: 12px;
    font-family: 'Space Mono', monospace;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 20px;
  }
  .edit-btn:hover { background: rgba(255,255,255,0.18); }
  .edit-btn.active {
    background: rgba(59,130,246,0.35);
    border-color: rgba(59,130,246,0.55);
    color: white;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'Space Mono', monospace;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: all 0.3s;
  }
  .status-dot.connected { background: var(--success); box-shadow: 0 0 6px var(--success); }
  .status-dot.error     { background: #ef4444;        box-shadow: 0 0 6px #ef4444; }

  /* ── Button Grid ── */
  main {
    flex: 1;
    padding: 10px;
    display: grid;
    /* rows/cols via JS */
    overflow: hidden;
    position: relative;
    z-index: 1;
    isolation: isolate;
    background: #000000;
  }

  /* 버튼 공통 이미지 레이어 — JS가 --bg-x/y/w/h 를 주입 */
  .btn::before, .btn-empty::before {
    content: '';
    position: absolute;
    inset: -24px;
    background-image: var(--bg-image);
    background-size: var(--bg-w, 100vw) var(--bg-h, 100vh);
    background-position:
      calc(var(--bg-x, 0px) + 24px)
      calc(var(--bg-y, 0px) + 24px);
    /* overflow:hidden 대신 자체 clip-path 사용 —
       iOS Safari는 filter 적용된 자식을 부모 radius로 못 자르는 버그가 있음 */
    -webkit-clip-path: inset(24px round var(--radius));
    clip-path: inset(24px round var(--radius));
    z-index: 0;
    pointer-events: none;
  }

  /* ── 빈 슬롯 ── */
  .btn-empty {
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
    will-change: transform; /* iOS GPU 레이어 확보 */
  }
  .btn-empty::before {
    filter: blur(5px) saturate(120%) brightness(0.55);
  }

  /* ── Liquid Glass Button ── */
  .btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    user-select: none;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.15s;
    will-change: transform; /* iOS GPU 레이어 확보 */
    box-shadow:
      0 4px 20px rgba(0,0,0,0.25),
      inset 0 1.5px 0 rgba(255,255,255,0.35),
      inset 0 -1px 0 rgba(0,0,0,0.15);
  }
  .btn::before {
    filter: blur(5px) saturate(180%) brightness(1.05);
  }

  /* 상단 유리 광택 */
  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(255,255,255,0.18) 0%, transparent 50%);
    z-index: 2;
    pointer-events: none;
  }

  .btn:hover {
    transform: translateY(-2px) scale(1.02);
    box-shadow:
      0 12px 36px rgba(0,0,0,0.3),
      inset 0 1.5px 0 rgba(255,255,255,0.45),
      inset 0 -1px 0 rgba(0,0,0,0.1);
  }
  .btn.pressed {
    transform: scale(0.92);
    background: rgba(255,255,255,0.18);
  }

  .btn.flash {
    box-shadow: 0 0 0 2px var(--success), 0 6px 28px rgba(16,185,129,0.35);
  }

  .btn.edit-mode {
    animation: wiggle 0.55s ease-in-out infinite alternate;
    cursor: pointer;
  }
  @keyframes wiggle {
    from { transform: rotate(-1.2deg) scale(0.98); }
    to   { transform: rotate(1.2deg)  scale(0.98); }
  }

  .btn-icon {
    position: relative;
    z-index: 1;
    color: rgba(255,255,255,0.9);
    transition: transform 0.15s;
    line-height: 1;
  }
  .btn:hover .btn-icon { transform: scale(1.1); }

  .btn-label {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.72);
    text-align: center;
    position: relative;
    z-index: 1;
    line-height: 1.3;
    text-shadow: 0 1px 4px rgba(0,0,0,0.35);
  }

  /* 편집 모드 배지 */
  .edit-badge {
    position: absolute;
    top: 8px; right: 8px;
    z-index: 2;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: rgba(59,130,246,0.7);
    border: 1px solid rgba(255,255,255,0.3);
    display: flex; align-items: center; justify-content: center;
    color: white;
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
  }
  .btn.edit-mode .edit-badge { opacity: 1; }

  /* ── Banner ── */
  .banner {
    position: fixed;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    background: rgba(239,68,68,0.18);
    border: 1px solid rgba(239,68,68,0.35);
    backdrop-filter: blur(12px);
    border-radius: 10px;
    padding: 9px 18px;
    font-size: 12px;
    color: #fca5a5;
    white-space: nowrap;
    display: none;
  }
  .banner.show { display: block; }

  /* ── Main Footer (버튼 페이지 네비) ── */
  footer {
    z-index: 10;
    flex-shrink: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    background: #0d0d0d;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  .nav-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.85);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.2); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }

  .page-indicator {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .page-label {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 1px;
  }

  .page-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .page-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: all 0.2s;
    cursor: pointer;
  }
  .page-dot.active {
    background: white;
    width: 20px;
    border-radius: 3px;
  }

  /* ── Icon Picker Modal ── */
  .picker-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0,10,30,0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    -webkit-transform: translateZ(0);
    transform: translateZ(0);
  }
  .picker-overlay.show {
    opacity: 1;
    pointer-events: all;
  }

  .picker-card {
    /* overlay 기준 absolute — 높이가 명시적으로 고정됨 */
    position: absolute;
    top: 16px;
    left: 12px;
    right: 12px;
    bottom: max(16px, env(safe-area-inset-bottom));
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.22);
    backdrop-filter: blur(32px) saturate(200%);
    -webkit-backdrop-filter: blur(32px) saturate(200%);
    border-radius: 24px;
    /* header / 스크롤영역 / footer 3행 고정 */
    display: grid;
    grid-template-rows: auto 1fr auto;
    overflow: hidden;
    box-shadow:
      0 24px 64px rgba(0,0,0,0.45),
      inset 0 1.5px 0 rgba(255,255,255,0.3);
  }

  .picker-header {
    padding: 14px 16px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .picker-title {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: rgba(255,255,255,0.7);
    flex-shrink: 0;
  }

  .picker-search {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    padding: 7px 13px;
    color: white;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    min-width: 0;
  }
  .picker-search::placeholder { color: rgba(255,255,255,0.35); }
  .picker-search:focus {
    border-color: rgba(255,255,255,0.38);
    background: rgba(255,255,255,0.15);
  }

  .picker-close {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 9px;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: rgba(255,255,255,0.8);
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .picker-close:hover { background: rgba(255,255,255,0.2); }

  .picker-grid {
    /* grid-row: 2 (1fr) — 남은 공간 전부 차지하고 내부만 스크롤 */
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(54px, 1fr));
    gap: 7px;
    padding: 14px;
    overflow-y: auto;
    align-content: start;
    -webkit-overflow-scrolling: touch;
  }

  .picker-icon-item {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.11);
    cursor: pointer;
    transition: all 0.12s;
    color: rgba(255,255,255,0.85);
  }
  .picker-icon-item:hover {
    background: rgba(255,255,255,0.2);
    border-color: rgba(255,255,255,0.35);
    transform: scale(1.1);
  }
  .picker-icon-item.selected {
    background: rgba(59,130,246,0.35);
    border-color: rgba(59,130,246,0.65);
    box-shadow: 0 0 10px rgba(59,130,246,0.3);
  }

  .picker-footer {
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-top: 1px solid rgba(255,255,255,0.1);
    /* grid-row: 3 (auto) — 항상 카드 맨 아래에 고정 */
  }

  /* 페이지 점 인디케이터 */
  .picker-dots {
    display: flex;
    justify-content: center;
    gap: 5px;
  }
  .picker-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .picker-dot.active {
    background: white;
    width: 18px;
    border-radius: 3px;
  }

  .picker-footer-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .picker-page-info {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.45);
  }

  .picker-nav { display: flex; gap: 7px; }

  .picker-nav-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 10px;
    /* 모바일 탭 영역 확보 */
    padding: 10px 20px;
    min-width: 80px;
    color: rgba(255,255,255,0.85);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    text-align: center;
  }
  .picker-nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.2); }
  /* 비활성이어도 존재감 있게 */
  .picker-nav-btn:disabled { opacity: 0.45; cursor: default; }

  .picker-empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 32px;
    color: rgba(255,255,255,0.35);
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">FeatherPad</div>
  <div class="header-right">
    <button class="edit-btn" id="editBtn" onclick="toggleEditMode()">편집</button>
    <div class="status">
      <div class="status-dot" id="dot"></div>
      <span id="statusText">연결 중...</span>
    </div>
  </div>
</header>

<main id="main"></main>

<footer id="footer">
  <button class="nav-btn" id="prevPage" onclick="changeBtnPage(-1)">
    <iconify-icon icon="tabler:chevron-left" width="18"></iconify-icon>
  </button>
  <div class="page-indicator" id="pageIndicator"></div>
  <button class="nav-btn" id="nextPage" onclick="changeBtnPage(1)">
    <iconify-icon icon="tabler:chevron-right" width="18"></iconify-icon>
  </button>
</footer>

<div class="banner" id="banner">서버에 연결할 수 없어요 — node server.js</div>

<!-- Icon Picker -->
<div class="picker-overlay" id="pickerOverlay">
  <div class="picker-card">
    <div class="picker-header">
      <span class="picker-title">아이콘 선택</span>
      <input class="picker-search" id="pickerSearch" placeholder="검색..." oninput="onPickerSearch(this.value)">
      <div class="picker-close" onclick="closePicker()">
        <iconify-icon icon="tabler:x" width="16"></iconify-icon>
      </div>
    </div>
    <div class="picker-grid" id="pickerGrid">
      <div class="picker-empty" id="pickerLoading">아이콘 목록 불러오는 중...</div>
    </div>
    <div class="picker-footer">
      <div class="picker-dots" id="pickerDots"></div>
      <div class="picker-footer-row">
        <span class="picker-page-info" id="pickerPageInfo"></span>
        <div class="picker-nav">
          <button class="picker-nav-btn" id="prevBtn" onclick="changePage(-1)">← 이전</button>
          <button class="picker-nav-btn" id="nextBtn" onclick="changePage(1)">다음 →</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const dot        = document.getElementById('dot');
  const statusText = document.getElementById('statusText');
  const banner     = document.getElementById('banner');
  const mainEl     = document.getElementById('main');
  const editBtnEl  = document.getElementById('editBtn');

  const ICONS_PER_PAGE = 54;

  let ws, reconnectTimer;
  let buttons = [], groups = [];
  let editMode = false;
  let pickerTarget = null;
  let allIcons = [];
  let filteredIcons = [];
  let iconPickerPage = 0;
  let btnPage = 0;          // 현재 버튼 페이지 (그룹 인덱스)
  let pressedBtn = null, pressedEl = null, longPressTimer = null;
  let customIcons = JSON.parse(localStorage.getItem('sp_icons') || '{}');

  const footerEl    = document.getElementById('footer');
  const prevPageBtn = document.getElementById('prevPage');
  const nextPageBtn = document.getElementById('nextPage');
  const pageIndEl   = document.getElementById('pageIndicator');

  // ── 레이아웃: 항상 12슬롯, 가로>세로면 4×3, 아니면 3×4 ──
  const GAP = 10, PAD = 10, TOTAL_SLOTS = 12;

  function getLayout() {
    return window.innerWidth > window.innerHeight
      ? { cols: 4, rows: 3 }
      : { cols: 3, rows: 4 };
  }

  function setupGrid() {
    const { cols, rows } = getLayout();
    const availW = mainEl.clientWidth  - PAD * 2;
    const availH = mainEl.clientHeight - PAD * 2;
    const size   = Math.floor(Math.min(
      (availW - GAP * (cols - 1)) / cols,
      (availH - GAP * (rows - 1)) / rows
    ));
    mainEl.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
    mainEl.style.gridTemplateRows    = `repeat(${rows}, ${size}px)`;
    mainEl.style.gap          = `${GAP}px`;
    mainEl.style.placeContent = 'center';
  }

  // 이미지 자연 크기 (cover 비율 계산용)
  let bgNaturalW = 0, bgNaturalH = 0;
  const _bgImg = new Image();
  _bgImg.onload = () => {
    bgNaturalW = _bgImg.naturalWidth;
    bgNaturalH = _bgImg.naturalHeight;
    updateBgPositions();
  };
  _bgImg.src = 'https://images.pexels.com/photos/12246252/pexels-photo-12246252.jpeg';

  // cover + center 기준으로 각 버튼 배경 위치 계산
  function updateBgPositions() {
    const vw = window.innerWidth, vh = window.innerHeight;

    // 비율 유지하며 viewport를 덮는 크기 계산 (background-size: cover 동작)
    let bgW, bgH;
    if (bgNaturalW && bgNaturalH) {
      const scale = Math.max(vw / bgNaturalW, vh / bgNaturalH);
      bgW = Math.round(bgNaturalW * scale);
      bgH = Math.round(bgNaturalH * scale);
    } else {
      bgW = vw; bgH = vh;
    }

    // 이미지를 viewport 중앙에 배치했을 때의 시작 좌표
    const ox = Math.round((vw - bgW) / 2);
    const oy = Math.round((vh - bgH) / 2);

    mainEl.querySelectorAll('.btn, .btn-empty').forEach(el => {
      const r = el.getBoundingClientRect();
      el.style.setProperty('--bg-w', `${bgW}px`);
      el.style.setProperty('--bg-h', `${bgH}px`);
      el.style.setProperty('--bg-x', `${ox - r.left}px`);
      el.style.setProperty('--bg-y', `${oy - r.top}px`);
    });
  }

  window.addEventListener('resize', () => { if (groups.length) renderPage(); });

  // ── 데이터 로드 ──────────────────────────────────────────
  async function loadData() {
    try {
      const [cfgRes, btnRes, grpRes] = await Promise.all([
        fetch('/config'), fetch('/buttons'), fetch('/groups'),
      ]);
      const cfg = await cfgRes.json();
      buttons   = await btnRes.json();
      groups    = await grpRes.json();

      // 배경 이미지 적용
      if (cfg.bgImage) {
        document.documentElement.style.setProperty('--bg-image', `url('${cfg.bgImage}')`);
        _bgImg.src = cfg.bgImage;
      }

      renderPage();
    } catch(e) {
      console.error('데이터 로드 실패', e);
    }
  }

  function getIcon(btn) {
    return customIcons[btn.id] || btn.icon;
  }

  // ── 버튼 페이지 렌더링 ────────────────────────────────────
  function renderPage() {
    const group    = groups[btnPage];
    const pageBtns = buttons.filter(b => group.ids.includes(b.id));

    setupGrid();
    mainEl.innerHTML = '';

    for (let i = 0; i < TOTAL_SLOTS; i++) {
      const btn = pageBtns[i];
      const el  = document.createElement('div');
      if (btn) {
        el.className = 'btn' + (editMode ? ' edit-mode' : '');
        el.id = 'btn-' + btn.id;
        el.innerHTML = `
          <div class="btn-icon">
            <iconify-icon icon="${getIcon(btn)}" width="30" height="30"></iconify-icon>
          </div>
          <div class="btn-label">${btn.label}</div>
          <div class="edit-badge">
            <iconify-icon icon="tabler:pencil" width="11"></iconify-icon>
          </div>
        `;
        el.addEventListener('pointerdown', (e) => onPointerDown(e, btn, el));
        el.addEventListener('pointerup',   onPointerUp);
        el.addEventListener('pointerleave', onPointerUp);
      } else {
        el.className = 'btn-empty';
      }
      mainEl.appendChild(el);
    }

    // 배경 위치 주입 (렌더 직후 DOM에 반영된 좌표 사용)
    requestAnimationFrame(updateBgPositions);

    // 푸터 인디케이터 갱신
    prevPageBtn.disabled = btnPage === 0;
    nextPageBtn.disabled = btnPage === groups.length - 1;
    pageIndEl.innerHTML = `
      <div class="page-label">${group.label}</div>
      <div class="page-dots">
        ${groups.map((g, i) => `<div class="page-dot ${i === btnPage ? 'active' : ''}" onclick="goToPage(${i})"></div>`).join('')}
      </div>
    `;
  }

  function changeBtnPage(dir) {
    const next = btnPage + dir;
    if (next < 0 || next >= groups.length) return;
    btnPage = next;
    renderPage();
  }

  function goToPage(i) {
    btnPage = i;
    renderPage();
  }

  // 메인 영역 스와이프로 페이지 전환
  let swipeBtnStartX = 0;
  mainEl.addEventListener('touchstart', e => { swipeBtnStartX = e.touches[0].clientX; }, { passive: true });
  mainEl.addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].clientX - swipeBtnStartX;
    if (Math.abs(dx) > 50) changeBtnPage(dx < 0 ? 1 : -1);
  }, { passive: true });

  // ── 편집 모드 ─────────────────────────────────────────────
  function toggleEditMode() {
    editMode = !editMode;
    editBtnEl.classList.toggle('active', editMode);
    editBtnEl.textContent = editMode ? '완료' : '편집';
    renderPage();
  }

  // ── 클릭 사운드 (Web Audio API — 저지연) ────────────────────
  let _audioCtx = null;
  let _clickBuf = null;

  function _initAudio() {
    if (_audioCtx) return;
    _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    fetch('/click.mp3?v=' + Date.now())
      .then(r => r.arrayBuffer())
      .then(buf => _audioCtx.decodeAudioData(buf))
      .then(decoded => { _clickBuf = decoded; })
      .catch(() => {});
  }

  function playClick() {
    try {
      if (!_audioCtx) _initAudio();
      if (!_clickBuf) return;
      if (_audioCtx.state === 'suspended') _audioCtx.resume();
      const src = _audioCtx.createBufferSource();
      src.buffer = _clickBuf;
      const gain = _audioCtx.createGain();
      gain.gain.value = 0.6;
      src.connect(gain);
      gain.connect(_audioCtx.destination);
      src.start(0);
    } catch(_) {}
  }

  _initAudio(); // 미리 버퍼 로드

  // ── 포인터 이벤트 ─────────────────────────────────────────
  function onPointerDown(e, btn, el) {
    if (editMode) {
      openPicker(btn);
      return;
    }
    playClick();
    pressedBtn = btn;
    pressedEl  = el;
    el.classList.add('pressed');
    longPressTimer = setTimeout(() => {
      longPressTimer = null;
      el.classList.remove('pressed');
      openPicker(btn);
    }, 550);
  }

  function onPointerUp() {
    if (longPressTimer !== null) {
      clearTimeout(longPressTimer);
      longPressTimer = null;
      if (pressedBtn && pressedEl) triggerButton(pressedBtn, pressedEl);
    }
    if (pressedEl) pressedEl.classList.remove('pressed');
    pressedBtn = pressedEl = null;
  }

  function triggerButton(btn, el) {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 420);
    ws.send(JSON.stringify({ action: btn.action, value: btn.value }));
  }

  // ── 아이콘 피커 ───────────────────────────────────────────
  async function loadIconList() {
    if (allIcons.length) return;
    try {
      const res  = await fetch('https://api.iconify.design/collection?prefix=tabler');
      const data = await res.json();
      const iconObj = data.icons || {};
      allIcons = Object.keys(iconObj).map(n => `tabler:${n}`);
    } catch(e) {
      console.error('아이콘 목록 로드 실패', e);
      allIcons = [];
    }
  }

  async function openPicker(btn) {
    pickerTarget  = btn;
    currentPage   = 0;
    document.getElementById('pickerSearch').value = '';
    document.getElementById('pickerOverlay').classList.add('show');

    const grid = document.getElementById('pickerGrid');
    grid.innerHTML = '<div class="picker-empty" id="pickerLoading">아이콘 목록 불러오는 중...</div>';

    await loadIconList();
    filteredIcons = allIcons;
    renderPickerPage();
  }

  function closePicker() {
    document.getElementById('pickerOverlay').classList.remove('show');
    pickerTarget = null;
  }

  function onPickerSearch(query) {
    const q = query.trim().toLowerCase();
    filteredIcons = q
      ? allIcons.filter(n => n.replace('tabler:', '').includes(q))
      : allIcons;
    currentPage = 0;
    renderPickerPage();
  }

  function changePage(dir) {
    const maxPage = Math.max(0, Math.ceil(filteredIcons.length / ICONS_PER_PAGE) - 1);
    currentPage = Math.max(0, Math.min(maxPage, currentPage + dir));
    renderPickerPage();
  }

  function renderPickerPage() {
    const grid     = document.getElementById('pickerGrid');
    const pageInfo = document.getElementById('pickerPageInfo');
    const prevBtn  = document.getElementById('prevBtn');
    const nextBtn  = document.getElementById('nextBtn');
    const dotsEl   = document.getElementById('pickerDots');

    const totalPages = Math.ceil(filteredIcons.length / ICONS_PER_PAGE);
    const start      = currentPage * ICONS_PER_PAGE;
    const pageIcons  = filteredIcons.slice(start, start + ICONS_PER_PAGE);
    const curIcon    = pickerTarget ? getIcon(pickerTarget) : null;

    if (pageIcons.length === 0) {
      grid.innerHTML = '<div class="picker-empty">검색 결과가 없어요</div>';
    } else {
      grid.innerHTML = pageIcons.map(name => `
        <div class="picker-icon-item ${name === curIcon ? 'selected' : ''}"
             title="${name.replace('tabler:','')}"
             onclick="selectIcon('${name}')">
          <iconify-icon icon="${name}" width="24" height="24"></iconify-icon>
        </div>
      `).join('');
    }

    pageInfo.textContent = `${currentPage + 1} / ${totalPages || 1}`;
    prevBtn.disabled = currentPage === 0;
    nextBtn.disabled = currentPage >= (totalPages - 1);

    // 점 인디케이터 — 최대 7개 표시 (앞뒤 생략)
    const MAX_DOTS = 7;
    if (totalPages <= 1) {
      dotsEl.innerHTML = '';
    } else {
      const half  = Math.floor(MAX_DOTS / 2);
      let startD  = Math.max(0, currentPage - half);
      let endD    = Math.min(totalPages, startD + MAX_DOTS);
      if (endD - startD < MAX_DOTS) startD = Math.max(0, endD - MAX_DOTS);
      let dots = '';
      for (let i = startD; i < endD; i++) {
        dots += `<div class="picker-dot ${i === currentPage ? 'active' : ''}" onclick="gotoPage(${i})"></div>`;
      }
      dotsEl.innerHTML = dots;
    }
  }

  function gotoPage(n) {
    currentPage = n;
    renderPickerPage();
  }

  // 스와이프 지원
  let swipeStartX = 0;
  document.getElementById('pickerGrid').addEventListener('touchstart', e => {
    swipeStartX = e.touches[0].clientX;
  }, { passive: true });
  document.getElementById('pickerGrid').addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - swipeStartX;
    if (Math.abs(dx) > 48) changePage(dx < 0 ? 1 : -1);
  }, { passive: true });

  function selectIcon(iconName) {
    if (!pickerTarget) return;
    customIcons[pickerTarget.id] = iconName;
    localStorage.setItem('sp_icons', JSON.stringify(customIcons));
    const btnEl = document.getElementById('btn-' + pickerTarget.id);
    if (btnEl) btnEl.querySelector('.btn-icon iconify-icon').setAttribute('icon', iconName);
    closePicker();
  }

  // 피커 바깥 클릭 시 닫기
  document.getElementById('pickerOverlay').addEventListener('pointerdown', function(e) {
    if (e.target === this) closePicker();
  });

  // ── WebSocket ─────────────────────────────────────────────
  function connect() {
    ws = new WebSocket(`ws://${location.host}`);
    ws.onopen = () => {
      dot.className   = 'status-dot connected';
      statusText.textContent = '연결됨';
      banner.classList.remove('show');
      clearTimeout(reconnectTimer);
    };
    ws.onclose = () => {
      dot.className   = 'status-dot error';
      statusText.textContent = '연결 끊김';
      banner.classList.add('show');
      reconnectTimer = setTimeout(connect, 3000);
    };
    ws.onerror = () => {
      dot.className   = 'status-dot error';
      statusText.textContent = '오류';
    };
  }

  loadData();
  connect();
</script>
</body>
</html>
